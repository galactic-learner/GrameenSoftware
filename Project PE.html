
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project PE — GrameenSoftware</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet"> -->
<link href="https://fonts.cdnfonts.com/css/akrobat" rel="stylesheet">

<style>

:root{
    --brand:#FE5E41;
    --bg:#000000;
    --bg2:#141414;
    --white:#ffffff;
    --nav-h:70px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'akrobat',sans-serif;
    background:var(--bg);
    color:var(--white);
    overflow-x:hidden;
}

img{
    display:block;
    max-width:100%;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:var(--nav-h);
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,0.96);
    border-bottom:1px solid rgba(254,94,65,0.14);
    z-index:1000;
    backdrop-filter:blur(12px);
}

.logo{
    height:34px;
    width:auto;
}

/* DESKTOP NAV */

.nav-links{
    display:flex;
    list-style:none;
    gap:6px;
}

.nav-links li{
    position:relative;
}

.nav-links a{
    text-decoration:none;
    color:rgba(255,255,255,0.7);
    font-size:.82rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:10px 14px;
    border-radius:4px;
    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--brand);
    background:rgba(254,94,65,0.08);
}

/* DROPDOWN */

.dropdown-menu{
    position:absolute;
    top:110%;
    left:0;
    min-width:180px;
    background:#181818;
    border:1px solid rgba(254,94,65,0.15);
    border-radius:8px;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    transform:translateY(10px);
    transition:.25s;
}

.dropdown:hover .dropdown-menu{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.dropdown-menu a{
    display:block;
    padding:14px 18px;
}

/* HAMBURGER */

.hamburger{
    display:none;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
}

.hamburger span{
    width:24px;
    height:2px;
    background:#fff;
    border-radius:20px;
    transition:.3s;
}

.hamburger.active span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.hamburger.active span:nth-child(2){
    opacity:0;
}

.hamburger.active span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}

/* MOBILE MENU */

.mobile-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:998;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.mobile-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.mobile-menu{
    position:fixed;
    top:0;
    right:-100%;
    width:280px;
    height:100vh;
    background:#111;
    border-left:1px solid rgba(254,94,65,0.15);
    z-index:999;
    padding:100px 24px 40px;
    transition:.35s ease;
}

.mobile-menu.show{
    right:0;
}

.mobile-menu ul{
    list-style:none;
}

.mobile-menu li{
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.mobile-menu a{
    display:block;
    text-decoration:none;
    color:rgba(255,255,255,0.82);
    padding:18px 0;
    font-size:1rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:700;
}

.mobile-sub{
    padding-left:16px;
}

.mobile-sub a{
    color:var(--brand);
    font-size:.88rem;
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:120px 20px 60px;
    position:relative;
    overflow:hidden;
}

/* BACKGROUND */

.hero-bg{
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(254,94,65,0.12),
    transparent 60%);
}

/* RINGS */

.rings{
    position:absolute;
    width:100vmin;
    height:100vmin;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.ring{
    position:absolute;
    top:50%;
    left:50%;
    border-radius:50%;
    border:1px solid rgba(254,94,65,0.08);
    animation:ringPulse 5s linear infinite;
}

.ring:nth-child(1){
    width:30%;
    height:30%;
    margin-left:-15%;
    margin-top:-15%;
    animation-delay:0s;
}

.ring:nth-child(2){
    width:60%;
    height:60%;
    margin-left:-30%;
    margin-top:-30%;
    animation-delay:-1.7s;
}

.ring:nth-child(3){
    width:90%;
    height:90%;
    margin-left:-45%;
    margin-top:-45%;
    animation-delay:-3.4s;
}

/* CONTENT */

.hero-content{
    position:relative;
    z-index:2;
}

.badge{
    display:inline-block;
    margin-bottom:28px;
    padding:6px 16px;
    border:1px solid rgba(254,94,65,0.2);
    border-radius:999px;
    color:var(--brand);
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.24em;
}

h1{
    font-size:clamp(4rem,15vw,12rem);
    line-height:.9;
    font-weight:900;
    letter-spacing:-.03em;
}

h1 span{
    color:var(--brand);
}

.subtext{
    margin-top:24px;
    color:rgba(255,255,255,0.32);
    font-size:clamp(.9rem,2vw,1.3rem);
    text-transform:uppercase;
    letter-spacing:.22em;
    font-weight:700;
}

.dots{
    display:inline-flex;
    gap:5px;
    margin-left:6px;
}

.dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--brand);
    animation:blink 1.4s ease infinite;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

/* BUTTON */

.back-btn{
    display:inline-block;
    margin-top:52px;
    text-decoration:none;
    color:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.12);
    padding:12px 24px;
    border-radius:4px;
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:.75rem;
    font-weight:700;
    transition:.25s;
}

.back-btn:hover{
    color:var(--brand);
    border-color:rgba(254,94,65,0.35);
    background:rgba(254,94,65,0.06);
}

/* FOOTER */

footer{
    padding:34px 20px;
    border-top:1px solid rgba(255,255,255,0.06);
}

.footer-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.footer-logo{
    height:26px;
}

.footer-copy{
    color:rgba(255,255,255,0.28);
    font-size:.82rem;
}

.footer-brand{
    color:var(--brand);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
}

/* ANIMATIONS */

@keyframes ringPulse{

    0%{
        transform:translate(-50%,-50%) scale(.94);
        opacity:.7;
    }

    100%{
        transform:translate(-50%,-50%) scale(1.2);
        opacity:0;
    }
}

@keyframes blink{

    0%,100%{
        opacity:.35;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}

/* RESPONSIVE */

@media(max-width:768px){

    nav{
        padding:0 16px;
    }

    .nav-links{
        display:none;
    }

    .hamburger{
        display:flex;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <a href="index.html">
        <img src="logo.png" alt="GrameenSoftware" class="logo">
    </a>

    <ul class="nav-links">

        <li><a href="index.html#home">Home</a></li>

        <li class="dropdown">

            <a href="index.html#projects" class="active">
                Projects
            </a>

            <div class="dropdown-menu">
                <a href="Project PE.html" class="active">
                    Project PE
                </a>
            </div>

        </li>

        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>

    </ul>

    <button class="hamburger" id="hamburger">

        <span></span>
        <span></span>
        <span></span>

    </button>

</nav>

<!-- MOBILE -->

<div class="mobile-overlay" id="overlay"></div>

<div class="mobile-menu" id="mobileMenu">

    <ul>

        <li><a href="index.html#home" class="mobile-link">Home</a></li>

        <li><a href="index.html#projects" class="mobile-link">Projects</a></li>

        <li class="mobile-sub">
            <a href="Project PE.html">→ Project PE</a>
        </li>

        <li><a href="index.html#about" class="mobile-link">About</a></li>

        <li><a href="index.html#contact" class="mobile-link">Contact</a></li>

    </ul>

</div>

<!-- HERO -->

<section class="hero">

    <div class="hero-bg"></div>

    <div class="rings">

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

    </div>

    <div class="hero-content">

        <div class="badge">
            GrameenSoftware · Flagship
        </div>

        <h1>
            Project <span>PE</span>
        </h1>

        <div class="subtext">

            coming soon

            <span class="dots">
                <span></span>
                <span></span>
                <span></span>
            </span>

        </div>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>

</section>

<!-- FOOTER -->

<footer>

    <div class="footer-inner">

        <img src="logo.png" alt="GrameenSoftware" class="footer-logo">

        <div class="footer-copy">
            © 2026 GrameenSoftware. All rights reserved.
        </div>

        <div class="footer-brand">
            Built with purpose.
        </div>

    </div>

</footer>

<script>

const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
const overlay = document.getElementById('overlay');
const mobileLinks = document.querySelectorAll('.mobile-link');

function openMenu(){

    hamburger.classList.add('active');
    mobileMenu.classList.add('show');
    overlay.classList.add('show');

    document.body.style.overflow = 'hidden';
}

function closeMenu(){

    hamburger.classList.remove('active');
    mobileMenu.classList.remove('show');
    overlay.classList.remove('show');

    document.body.style.overflow = '';
}

hamburger.addEventListener('click', () => {

    if(mobileMenu.classList.contains('show')){
        closeMenu();
    }else{
        openMenu();
    }

});

overlay.addEventListener('click', closeMenu);

mobileLinks.forEach(link => {
    link.addEventListener('click', closeMenu);
});

</script>

</body>
</html>
